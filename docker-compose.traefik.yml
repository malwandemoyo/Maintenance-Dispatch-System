# Traefik Configuration with Cloudflare Tunnel
# This replaces manual Nginx configuration
# See: https://doc.traefik.io/traefik/

version: '3.8'

services:
  # ==================== TRAEFIK ====================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    
    networks:
      - maintenance-network
    
    ports:
      # HTTP
      - "80:80"
      # HTTPS
      - "443:443"
      # Traefik Dashboard (internal only)
      - "127.0.0.1:8080:8080"
    
    environment:
      # Cloudflare Integration
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_API_KEY: ${CF_API_KEY}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    
    volumes:
      # Docker socket for container discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # Traefik configuration
      - ./config/traefik.yml:/traefik.yml:ro
      - ./config/traefik-dynamic.yml:/traefik-dynamic.yml:ro
      
      # ACME certificate storage
      - traefik-acme:/acme
      
      # Logs
      - ./logs/traefik:/logs
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}"

  # ==================== CLOUDFLARE TUNNEL - FRONTEND ====================
  # Run this in a separate container for secure tunnel connection
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    
    networks:
      - maintenance-network
    
    command: tunnel --config /etc/cloudflared/config.yml run
    
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    
    volumes:
      - ./config/cloudflared.yml:/etc/cloudflared/config.yml:ro
    
    depends_on:
      - traefik

  # ==================== CLOUDFLARE TUNNEL - BACKEND ====================
  # Separate tunnel for backend domain (backend.malwande.me)
  # Allows independent management and isolation from frontend tunnel
  cloudflare-tunnel-backend:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel-backend
    restart: always
    
    networks:
      - maintenance-network
    
    command: tunnel --config /etc/cloudflared/config-backend.yml run
    
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_BACKEND_TUNNEL_TOKEN}
    
    volumes:
      - ./config/cloudflared-backend.yml:/etc/cloudflared/config-backend.yml:ro
    
    depends_on:
      - traefik

volumes:
  traefik-acme:

networks:
  maintenance-network:
    external: true
