# Test override - use with: docker compose -f docker-compose.yml -f docker-compose.test.yml up
# Configured for running tests: separate test database, no health checks blocking, fast startup

version: '3.8'

services:
  db:
    environment:
      POSTGRES_DB: maintenance_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"  # Different port to avoid conflicts

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
          sh -c "python manage.py migrate &&
            python manage.py test core.tests.PropertyAccessControlTestCase core.tests.TaskAccessControlTestCase"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment:
      DEBUG: "false"
      DJANGO_LOG_LEVEL: WARNING
      PYTHONUNBUFFERED: "1"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: maintenance_test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_ENV: test
    depends_on:
      db:
        condition: service_started  # Don't wait for health check in tests

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=test
    command: pnpm test
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: test
    depends_on:
      backend:
        condition: service_started
