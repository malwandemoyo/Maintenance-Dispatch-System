# Production override - use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.traefik.yml up
# Optimized for production with Traefik + Cloudflare Tunnel
# Domains configured via .env: FRONTEND_DOMAIN and BACKEND_DOMAIN
# Cloudflare Tunnel: Secure edge connection (no exposed ports)

version: '3.8'

services:
  db:
    restart: always
    # Don't expose port in production
    ports: []
    environment:
      POSTGRES_INITDB_ARGS: ""

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class sync --timeout 30
    volumes: []
    ports: []
    environment:
      DEBUG: "false"
      DJANGO_LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    networks:
      - maintenance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
    restart: always
    command: node server.js
    volumes: []
    ports: []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${BACKEND_DOMAIN}
    networks:
      - maintenance-network
    depends_on:
      - backend

  # ==================== Cloudflare Tunnel - Frontend ====================
  cloudflared-frontend:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - maintenance-network
    depends_on:
      - frontend

  # ==================== Cloudflare Tunnel - Backend ====================
  cloudflared-backend:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${CLOUDFLARE_BACKEND_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_BACKEND_TUNNEL_TOKEN=${CLOUDFLARE_BACKEND_TUNNEL_TOKEN}
    networks:
      - maintenance-network
    depends_on:
      - backend

volumes:
  db_data:
    driver: local

networks:
  maintenance-network:
    driver: bridge
