name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - backend+frontend/bothend-in-sync
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  # ==================== FRONTEND TESTS ====================
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Provide a safe, short-lived test secret for CI so env validation passes during lint/build
      AUTH_SECRET: test_ci_auth_secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Use Corepack (bundled with Node) to prepare/activate pnpm reliably
      - name: Ensure pnpm is available (Corepack, then fallback)
        run: |
          set -e
          echo "Checking for pnpm..."
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is already installed"
            pnpm --version
          else
            if command -v corepack >/dev/null 2>&1; then
              echo "Corepack found — enabling and preparing pnpm@10.25.0"
              corepack enable
              corepack prepare pnpm@10.25.0 --activate
              pnpm --version
            else
              echo "Corepack not found — falling back to npm global install of pnpm"
              npm install -g pnpm@10.25.0
              pnpm --version
            fi
          fi

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Type check
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Format check
        working-directory: ./frontend
        run: pnpm format:check

      - name: Auto-fix formatting with Prettier
        if: always()
        working-directory: ./frontend
        run: pnpm prettier --write "**/*.{ts,tsx,js,jsx,mdx}" --cache || true

      - name: Build
        working-directory: ./frontend
        env:
          SKIP_ENV_VALIDATION: "1"
          NODE_ENV: production
        run: pnpm build

  # ==================== BACKEND TESTS ====================
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: ./backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_ENV: test
          DEBUG: "false"
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_SECRET: test_secret_key_for_testing
        run: |
          python manage.py migrate
          python manage.py test

  # ==================== DEPLOY TO ORIGINAL PRODUCTION SERVER ====================
  deploy-production:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to production server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ github.ref_name }}

        run: |
          set -euxo pipefail
          SSH_PORT="${DEPLOY_PORT:-22}"

          mkdir -p ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -T 10 -H github.com >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: could not scan github.com host key"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$DEPLOY_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: could not scan $DEPLOY_SERVER:$SSH_PORT host key"

          echo "Checking TCP reachability to $DEPLOY_SERVER:$SSH_PORT..."
          if ! timeout 10 bash -c "</dev/tcp/$DEPLOY_SERVER/$SSH_PORT" 2>/dev/null; then
            echo "[ERROR] Cannot reach $DEPLOY_SERVER:$SSH_PORT from GitHub runner"
            echo "Check firewall/NSG rules, SSH daemon status, and configured DEPLOY_PORT"
            exit 1
          fi

          echo "Testing SSH connection..."
          ssh \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_SERVER" \
            "echo SSH connection successful"

          echo "Ensuring remote deploy path exists..."
          ssh \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_SERVER" \
            "mkdir -p $DEPLOY_PATH"

          echo "Uploading .env file..."
          echo "$ENV_FILE" > /tmp/.env
          scp \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            /tmp/.env \
            "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env"

          echo "Running remote deployment..."
          ssh \
            -p "$SSH_PORT" \
            -tt \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_SERVER" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_BRANCH='$DEPLOY_BRANCH' REPO_URL='$REPO_URL' bash -s" <<'EOF'

            set -euxo pipefail

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "Current directory:"
            pwd

            if [ ! -d .git ]; then
              if [ -z "$(ls -A .)" ]; then
                echo "Directory empty — cloning repository..."
                git clone --branch "$DEPLOY_BRANCH" "$REPO_URL" .
              else
                echo "Directory not a git repo and not empty — initializing git and fetching branch"
                git init
                git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
                git fetch --depth=1 origin "$DEPLOY_BRANCH" || git fetch origin "$DEPLOY_BRANCH"
                git checkout -f -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH" || git checkout -f -B "$DEPLOY_BRANCH"
              fi
            else
              echo "Updating repository..."
              git fetch origin
              git checkout "$DEPLOY_BRANCH" || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
              git pull origin "$DEPLOY_BRANCH"
            fi

            echo "Loading environment..."
            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
              echo "Environment loaded from .env"
            elif [ -f .env.production ]; then
              cp .env.production .env
              set -a
              . ./.env
              set +a
              echo "Environment loaded from .env.production"
            else
              echo "Neither .env nor .env.production found"
              ls -la
              exit 1
            fi

            echo "Docker version:"
            docker --version
            echo "Docker Compose version:"
            docker compose version

            echo "Pulling containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || { echo "[ERROR] docker compose pull failed"; exit 1; }

            echo "Starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build || { echo "[ERROR] docker compose up failed"; exit 1; }

            echo "Waiting for backend..."
            sleep 15
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps || { echo "[ERROR] docker compose ps failed"; exit 1; }

            echo "Running migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py migrate || { echo "[ERROR] migrate failed"; exit 1; }

            echo "Collecting static files..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput || { echo "[ERROR] collectstatic failed"; exit 1; }

            echo "Deployment completed successfully"

          EOF