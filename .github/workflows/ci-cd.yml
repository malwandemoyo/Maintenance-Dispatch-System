name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - backend+frontend/bothend-in-sync
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  # ==================== FRONTEND TESTS ====================
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Provide a safe, short-lived test secret for CI so env validation passes during lint/build
      AUTH_SECRET: test_ci_auth_secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Use Corepack (bundled with Node) to prepare/activate pnpm reliably
      - name: Ensure pnpm is available (Corepack, then fallback)
        run: |
          set -e
          echo "Checking for pnpm..."
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is already installed"
            pnpm --version
          else
            if command -v corepack >/dev/null 2>&1; then
              echo "Corepack found — enabling and preparing pnpm@10.25.0"
              corepack enable
              corepack prepare pnpm@10.25.0 --activate
              pnpm --version
            else
              echo "Corepack not found — falling back to npm global install of pnpm"
              npm install -g pnpm@10.25.0
              pnpm --version
            fi
          fi

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Type check
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Format check
        working-directory: ./frontend
        run: pnpm format:check

      - name: Auto-fix formatting with Prettier
        if: always()
        working-directory: ./frontend
        run: pnpm prettier --write "**/*.{ts,tsx,js,jsx,mdx}" --cache || true

      - name: Build
        working-directory: ./frontend
        env:
          SKIP_ENV_VALIDATION: "1"
          NODE_ENV: production
        run: pnpm build

  # ==================== BACKEND TESTS ====================
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: ./backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_ENV: test
          DEBUG: "false"
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_SECRET: test_secret_key_for_testing
        run: |
          python manage.py migrate
          python manage.py test

  # ==================== DEPLOY TO ORIGINAL PRODUCTION SERVER ====================
  deploy-production:
    needs: [frontend-test, backend-test]
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to production server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p '${DEPLOY_PATH}'"

          # Write the secure environment file to the runner, then copy it to the production host.
          echo "$ENV_FILE" > /tmp/.env
          scp -i ~/.ssh/deploy_key /tmp/.env $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_SERVER "DEPLOY_PATH='${DEPLOY_PATH}' REPO_URL='${REPO_URL}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash -s" << 'EOF'
            set -e
            echo "Starting deployment..."
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "No git repository found. Cloning $REPO_URL on branch $DEPLOY_BRANCH..."
              git clone --branch "$DEPLOY_BRANCH" "$REPO_URL" .
            else
              echo "Git repository found. Updating branch $DEPLOY_BRANCH..."
              git fetch origin "$DEPLOY_BRANCH"
              git checkout "$DEPLOY_BRANCH" 2>/dev/null || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
              git pull origin "$DEPLOY_BRANCH"
            fi
            
            # Load environment variables from .env file
            if [ -f .env ]; then
              echo "Loading environment from .env..."
              set -a
              . ./.env
              set +a
              echo "Environment loaded successfully"
            else
              echo "Warning: .env file not found at $PWD/.env"
            fi
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py migrate
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            echo "Deployment complete!"
          EOF