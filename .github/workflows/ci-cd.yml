name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - backend+frontend/bothend-in-sync
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: malwandemoyo/maintenance-dispatch-system/frontend
  BACKEND_IMAGE: malwandemoyo/maintenance-dispatch-system/backend

jobs:
  # ==================== FRONTEND TESTS ====================
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Provide a safe, short-lived test secret for CI so env validation passes during lint/build
      AUTH_SECRET: test_ci_auth_secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Use Corepack (bundled with Node) to prepare/activate pnpm reliably
      - name: Ensure pnpm is available (Corepack, then fallback)
        run: |
          set -e
          echo "Checking for pnpm..."
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is already installed"
            pnpm --version
          else
            if command -v corepack >/dev/null 2>&1; then
              echo "Corepack found — enabling and preparing pnpm@10.25.0"
              corepack enable
              corepack prepare pnpm@10.25.0 --activate
              pnpm --version
            else
              echo "Corepack not found — falling back to npm global install of pnpm"
              npm install -g pnpm@10.25.0
              pnpm --version
            fi
          fi

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Type check
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Format check
        working-directory: ./frontend
        run: pnpm format:check

      - name: Auto-fix formatting with Prettier
        if: always()
        working-directory: ./frontend
        run: pnpm prettier --write "**/*.{ts,tsx,js,jsx,mdx}" --cache || true

      - name: Build
        working-directory: ./frontend
        env:
          SKIP_ENV_VALIDATION: "1"
          NODE_ENV: production
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production frontend image
        run: |
          docker buildx build --load --target production -t frontend-test-image ./frontend

      - name: Smoke test frontend production image
        run: |
          container_id=$(docker run -d -p 3000:3000 frontend-test-image)
          sleep 8
          curl -f http://localhost:3000 || (docker logs "$container_id" && exit 1)
          docker stop "$container_id"

  # ==================== BACKEND TESTS ====================
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production backend image
        working-directory: ./backend
        run: |
          docker buildx build --load --target production -t backend-test-image .

      - name: Run Django tests
        working-directory: ./backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_ENV: test
          DEBUG: "false"
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_SECRET: test_secret_key_for_testing
        run: |
          python manage.py migrate
          python manage.py test

  # ==================== BUILD FRONTEND IMAGE ====================
  build-frontend:
    needs: frontend-test
    if: |
      !contains(github.event.head_commit.message, '[skip build]') &&
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha

      - name: Build and push Frontend image (tag = commit SHA)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== BUILD BACKEND IMAGE ====================
  build-backend:
    needs: backend-test
    if: |
      !contains(github.event.head_commit.message, '[skip build]') &&
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha

      - name: Build and push Backend image (tag = commit SHA)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== DEPLOY TO ORIGINAL PRODUCTION SERVER ====================
  deploy-production:
    needs: []
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts 2>/dev/null

          # Write the secure environment file to the runner, then copy it to the production host.
          echo "$ENV_FILE" > /tmp/.env.production
          scp -i ~/.ssh/deploy_key /tmp/.env.production $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env.production

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'
            set -e
            echo "Starting deployment..."
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout origin/main
            if [ -f .env.production ]; then
              export $(cat .env.production | xargs)
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py migrate
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            echo "Deployment complete!"
          EOF


  # ==================== DEPLOY TO AZURE CONTAINER APPS ====================
  deploy-to-azure:
    needs: [build-frontend, build-backend, create-azure-resources]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Normalize Azure resource names
        id: azure-names
        env:
          BACKEND_APP_RAW: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          FRONTEND_APP_RAW: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
        run: |
          set -e

          normalize_name() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//'
          }

          BACKEND_APP=$(normalize_name "$BACKEND_APP_RAW")
          FRONTEND_APP=$(normalize_name "$FRONTEND_APP_RAW")

          if [ -z "$BACKEND_APP" ] || [ -z "$FRONTEND_APP" ]; then
            echo "Azure container app names cannot be empty after normalization. Check AZURE_BACKEND_APP_NAME and AZURE_FRONTEND_APP_NAME."
            exit 1
          fi

          if [ ${#BACKEND_APP} -gt 31 ]; then BACKEND_APP=$(printf '%.31s' "$BACKEND_APP"); fi
          if [ ${#FRONTEND_APP} -gt 31 ]; then FRONTEND_APP=$(printf '%.31s' "$FRONTEND_APP"); fi

          case "$BACKEND_APP" in *[!a-z0-9]) BACKEND_APP="${BACKEND_APP%-}" ;; esac
          case "$FRONTEND_APP" in *[!a-z0-9]) FRONTEND_APP="${FRONTEND_APP%-}" ;; esac

          echo "BACKEND_APP=$BACKEND_APP" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_APP=$FRONTEND_APP" >> "$GITHUB_OUTPUT"

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          containerAppName: ${{ steps.azure-names.outputs.BACKEND_APP }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Deploy Frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          containerAppName: ${{ steps.azure-names.outputs.FRONTEND_APP }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}

  # ==================== CREATE AZURE RESOURCES (if missing) ====================
  create-azure-resources:
    needs: [build-frontend, build-backend]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Normalize Azure resource names
        id: azure-names
        env:
          BACKEND_APP_RAW: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          FRONTEND_APP_RAW: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          ENV_RAW: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
        run: |
          set -e

          normalize_name() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//'
          }

          BACKEND_APP=$(normalize_name "$BACKEND_APP_RAW")
          FRONTEND_APP=$(normalize_name "$FRONTEND_APP_RAW")
          ENV_NAME=$(normalize_name "$ENV_RAW")

          if [ -z "$BACKEND_APP" ] || [ -z "$FRONTEND_APP" ] || [ -z "$ENV_NAME" ]; then
            echo "Azure resource names cannot be empty after normalization. Check AZURE_BACKEND_APP_NAME, AZURE_FRONTEND_APP_NAME, and AZURE_CONTAINERAPPS_ENV."
            exit 1
          fi

          if [ ${#BACKEND_APP} -gt 31 ]; then BACKEND_APP=$(printf '%.31s' "$BACKEND_APP"); fi
          if [ ${#FRONTEND_APP} -gt 31 ]; then FRONTEND_APP=$(printf '%.31s' "$FRONTEND_APP"); fi
          if [ ${#ENV_NAME} -gt 31 ]; then ENV_NAME=$(printf '%.31s' "$ENV_NAME"); fi

          case "$BACKEND_APP" in *[!a-z0-9]) BACKEND_APP="${BACKEND_APP%-}" ;; esac
          case "$FRONTEND_APP" in *[!a-z0-9]) FRONTEND_APP="${FRONTEND_APP%-}" ;; esac
          case "$ENV_NAME" in *[!a-z0-9]) ENV_NAME="${ENV_NAME%-}" ;; esac

          echo "BACKEND_APP=$BACKEND_APP" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_APP=$FRONTEND_APP" >> "$GITHUB_OUTPUT"
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure resource group exists and resolve location
        id: rg-location
        env:
          RG_NAME: ${{ secrets.AZURE_RESOURCE_GROUP }}
          RG_LOCATION_FALLBACK: ${{ secrets.AZURE_LOCATION }}
        run: |
          set -e
          if [ -z "$RG_LOCATION_FALLBACK" ]; then
            RG_LOCATION_FALLBACK="eastus"
          fi

          if az group exists --name "$RG_NAME" | grep -q true; then
            RG_LOCATION=$(az group show --name "$RG_NAME" --query location -o tsv)
            echo "Resource group exists in location: $RG_LOCATION"
          else
            echo "Resource group does not exist. Creating in: $RG_LOCATION_FALLBACK"
            az group create --name "$RG_NAME" --location "$RG_LOCATION_FALLBACK" >/dev/null
            RG_LOCATION="$RG_LOCATION_FALLBACK"
          fi

          echo "RG_LOCATION=$RG_LOCATION" >> "$GITHUB_OUTPUT"

      - name: Register required Azure resource providers
        run: |
          set -e
          echo "Registering Microsoft.OperationalInsights provider..."
          az provider register -n Microsoft.OperationalInsights --wait
          echo "Registering Microsoft.App provider..."
          az provider register -n Microsoft.App --wait

      - name: Ensure Log Analytics workspace exists
        id: log-analytics
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          set -e
          LA_WORKSPACE="maintenance-dispatch-logs"
          if ! az monitor log-analytics workspace show --workspace-name "$LA_WORKSPACE" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Creating Log Analytics workspace: $LA_WORKSPACE"
            az monitor log-analytics workspace create --workspace-name "$LA_WORKSPACE" --resource-group "$RG" --location "${{ steps.rg-location.outputs.RG_LOCATION }}"
          else
            echo "Log Analytics workspace exists"
          fi
          LA_WORKSPACE_ID=$(az monitor log-analytics workspace show --workspace-name "$LA_WORKSPACE" --resource-group "$RG" --query id -o tsv)
          echo "LA_WORKSPACE_ID=$LA_WORKSPACE_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Container Apps environment exists
        run: |
          if ! az containerapp env show --name "${{ steps.azure-names.outputs.ENV_NAME }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            echo "Creating Container Apps environment with Log Analytics workspace"
            az containerapp env create \
              --name "${{ steps.azure-names.outputs.ENV_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --location "${{ steps.rg-location.outputs.RG_LOCATION }}" \
              --logs-workspace-id "${{ steps.log-analytics.outputs.LA_WORKSPACE_ID }}"
          else
            echo "Container Apps environment exists"
          fi

      - name: Ensure backend container app exists (create if missing)
        env:
          BACKEND_APP: ${{ steps.azure-names.outputs.BACKEND_APP }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ENV_NAME: ${{ steps.azure-names.outputs.ENV_NAME }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if ! az containerapp show --name "$BACKEND_APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Creating backend container app $BACKEND_APP"
            if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_PAT" ]; then
              az containerapp create --name "$BACKEND_APP" --resource-group "$RG" --environment "$ENV_NAME" --image "$IMAGE" --ingress external --target-port 8000 --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_PAT"
            else
              az containerapp create --name "$BACKEND_APP" --resource-group "$RG" --environment "$ENV_NAME" --image "$IMAGE" --ingress external --target-port 8000
            fi
          else
            echo "Backend app exists, skipping create"
          fi

      - name: Ensure frontend container app exists (create if missing)
        env:
          FRONTEND_APP: ${{ steps.azure-names.outputs.FRONTEND_APP }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ENV_NAME: ${{ steps.azure-names.outputs.ENV_NAME }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if ! az containerapp show --name "$FRONTEND_APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Creating frontend container app $FRONTEND_APP"
            if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_PAT" ]; then
              az containerapp create --name "$FRONTEND_APP" --resource-group "$RG" --environment "$ENV_NAME" --image "$IMAGE" --ingress external --target-port 3000 --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_PAT"
            else
              az containerapp create --name "$FRONTEND_APP" --resource-group "$RG" --environment "$ENV_NAME" --image "$IMAGE" --ingress external --target-port 3000
            fi
          else
            echo "Frontend app exists, skipping create"
          fi

      - name: Configure backend environment variables
        env:
          BACKEND_APP: ${{ steps.azure-names.outputs.BACKEND_APP }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RG" \
            --set-env-vars \
              DJANGO_ENV=production \
              DEBUG=false \
              SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              FRONTEND_DOMAIN="${{ secrets.FRONTEND_DOMAIN }}" \
              BACKEND_DOMAIN="${{ secrets.BACKEND_DOMAIN }}" \
              FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              BACKEND_URL="${{ secrets.BACKEND_URL }}" \
              ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}" \
              DB_ENGINE=django.db.backends.postgresql \
              DB_NAME="${{ secrets.DB_NAME }}" \
              DB_USER="${{ secrets.DB_USER }}" \
              DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              DB_HOST="${{ secrets.DB_HOST }}" \
              DB_PORT="${{ secrets.DB_PORT }}" \
              TIME_ZONE=Africa/Harare \
              AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              NEXT_PUBLIC_API_URL="${{ secrets.BACKEND_URL }}" \
              PRODUCTION_API_URL="${{ secrets.BACKEND_URL }}" \
              EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend \
              EMAIL_HOST="${{ secrets.EMAIL_HOST }}" \
              EMAIL_PORT="${{ secrets.EMAIL_PORT }}" \
              EMAIL_USE_TLS=true \
              EMAIL_HOST_USER="${{ secrets.EMAIL_HOST_USER }}" \
              EMAIL_HOST_PASSWORD="${{ secrets.EMAIL_HOST_PASSWORD }}" \
              DEFAULT_FROM_EMAIL="${{ secrets.DEFAULT_FROM_EMAIL }}" \
              AUTO_CREATE_SUPERUSER=false \
              DJANGO_LOG_LEVEL=WARNING \
              SESSION_COOKIE_SECURE=true \
              CSRF_COOKIE_SECURE=true \
              PYTHONUNBUFFERED=1

      - name: Configure frontend environment variables
        env:
          FRONTEND_APP: ${{ steps.azure-names.outputs.FRONTEND_APP }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RG" \
            --set-env-vars \
              NODE_ENV=production \
              NEXT_PUBLIC_API_URL="${{ secrets.BACKEND_URL }}" \
              FRONTEND_DOMAIN="${{ secrets.FRONTEND_DOMAIN }}" \
              AUTH_SECRET="${{ secrets.AUTH_SECRET }}"

      - name: Set Azure container app names
        id: azure-config
        run: |
          echo "AZURE_BACKEND_APP_NAME=${{ secrets.AZURE_BACKEND_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "AZURE_FRONTEND_APP_NAME=${{ secrets.AZURE_FRONTEND_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "AZURE_RESOURCE_GROUP=${{ secrets.AZURE_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT