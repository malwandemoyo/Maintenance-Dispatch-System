name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - backend+frontend/bothend-in-sync
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  BACKEND_IMAGE: ${{ github.repository }}/backend

jobs:
  # ==================== FRONTEND TESTS ====================
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Use Corepack (bundled with Node) to prepare/activate pnpm reliably
      - name: Ensure pnpm is available (Corepack, then fallback)
        run: |
          set -e
          echo "Checking for pnpm..."
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is already installed"
            pnpm --version
          else
            if command -v corepack >/dev/null 2>&1; then
              echo "Corepack found — enabling and preparing pnpm@10.25.0"
              corepack enable
              corepack prepare pnpm@10.25.0 --activate
              pnpm --version
            else
              echo "Corepack not found — falling back to npm global install of pnpm"
              npm install -g pnpm@10.25.0
              pnpm --version
            fi
          fi

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Type check
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Format check
        working-directory: ./frontend
        run: pnpm format:check

      - name: Build
        working-directory: ./frontend
        env:
          SKIP_ENV_VALIDATION: "1"
          NODE_ENV: production
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production frontend image
        run: |
          docker buildx build --load --target production -t frontend-test-image ./frontend

      - name: Smoke test frontend production image
        run: |
          container_id=$(docker run -d -p 3000:3000 frontend-test-image)
          sleep 8
          curl -f http://localhost:3000 || (docker logs "$container_id" && exit 1)
          docker stop "$container_id"

  # ==================== BACKEND TESTS ====================
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production backend image
        working-directory: ./backend
        run: |
          docker buildx build --load --target production -t backend-test-image .

      - name: Run Django tests
        working-directory: ./backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_ENV: test
          DEBUG: "false"
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_SECRET: test_secret_key_for_testing
        run: |
          python manage.py migrate
          python manage.py test

  # ==================== BUILD FRONTEND IMAGE ====================
  build-frontend:
    needs: frontend-test
    # FIXED: Added your current testing branch to the filter condition
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== BUILD BACKEND IMAGE ====================
  build-backend:
    needs: backend-test
    # FIXED: Added your current testing branch to the filter condition
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== DEPLOY TO ORIGINAL PRODUCTION SERVER ====================
  deploy-production:
    needs: [build-frontend, build-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'
            set -e
            echo "Starting deployment..."
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout origin/main
            if [ -f .env.production ]; then
              export $(cat .env.production | xargs)
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py migrate
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            echo "Deployment complete!"
          EOF

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Production deployment successful! Images: Frontend & Backend'
            })

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Production deployment failed. Check logs.'
            })

  # ==================== DEPLOY TO AZURE CONTAINER APPS ====================
  deploy-to-azure:
    needs: [build-frontend, build-backend]
    # FIXED: Indented properly and set up to deploy when tracking your sync branch
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backend+frontend/bothend-in-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # FIXED: Swapped placeholder group with your actual Resource Group: bhodlumlilo-public_group
      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ghcr.io/${{ github.repository }}/backend:backend+frontend-bothend-in-sync
          containerAppName: MyBackendApp
          resourceGroup: bhodlumlilo-public_group

      - name: Deploy Frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ghcr.io/${{ github.repository }}/frontend:backend+frontend-bothend-in-sync
          containerAppName: MyFrontendApp
          resourceGroup: bhodlumlilo-public_group